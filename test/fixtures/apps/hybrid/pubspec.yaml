name: hybrid
description: Hybrid mode — a thor page with Flutter web views embedded in it (FlutterView).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  thor_engine:
    path: ../../../../packages/thor_engine
  thor_ui:
    path: ../../../../packages/thor_ui

dev_dependencies:
  build_runner: ^2.4.0
  test: ^1.25.0
  thor_builder:
    path: ../../../../packages/thor_builder

# `thor build` runs `flutter build web` in flutter_widgets/ and publishes
# it under /flutter/ (FlutterView's default src). Not a workspace member:
# it needs the Flutter SDK, the rest of the repo resolves with plain Dart.
thor:
  flutter:
    project: flutter_widgets
    public: flutter
