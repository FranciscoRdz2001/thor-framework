name: landing
description: A static marketing page for a fictional product, built with thor, with a native theme, drawer, dropdown, accordion, carousel and responsive images.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  thor_engine:
    path: ../../../../packages/thor_engine
  thor_ui:
    path: ../../../../packages/thor_ui

dev_dependencies:
  build_runner: ^2.4.0
  thor_builder:
    path: ../../../../packages/thor_builder

thor:
  # web/images/ → WebP at these widths (the build writes the variants and
  # the page lists them in srcset): the step pictures are drawn at
  # 150–300 px, the hero at up to 1200.
  images:
    widths: [320, 640, 1280]
