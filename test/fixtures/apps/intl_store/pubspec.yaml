name: intl_store
description: A small shop in English and Spanish — thor's internationalization example (ARB messages, locale in the URL, formats, a translated counter in the browser).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  intl: ^0.20.2
  thor_engine:
    path: ../../../../packages/thor_engine
  thor_server:
    path: ../../../../packages/thor_server
  thor_ui:
    path: ../../../../packages/thor_ui

dev_dependencies:
  build_runner: ^2.4.0
  test: ^1.25.0
  thor_builder:
    path: ../../../../packages/thor_builder
  thor_test:
    path: ../../../../packages/thor_test

