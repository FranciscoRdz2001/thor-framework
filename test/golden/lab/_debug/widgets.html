        <details class="t-lab-page__expansion-tile" data-t-ev="toggle:LabState.expansionChanged" data-thor="ExpansionTile">
          <summary class="t-lab-page__summary">Preguntas</summary>
          <div class="t-lab-page__div">Respuesta.</div>
        </details>
        <span class="t-lab-page__text-4" data-tt="LabState.expansionLabel" data-thor="Text">Sin tocar</span>
        <span class="t-lab-page__text-2" data-thor="Text">AnimatedSize</span>
        <div class="t-lab-page__column-3" data-thor="Column">
          <button class="t-lab-page__filled-button" type="button" data-t-on="click:LabState.toggleMore" data-thor="FilledButton">Ver más</button>
          <div class="t-lab-page__animated-size" data-tsz="300|cubic-bezier(0, 0, 0.58, 1)|300" data-thor="AnimatedSize">
            <div class="t-lab-page__div-2">
              <div class="t-lab-page__container-2" data-tv="LabState.isMore" data-thor="Container" data-tp-1="|class|=t-lab-page__container-3;|#|=Mucho más contenido">Poco</div>
            </div>
          </div>
        </div>
        <span class="t-lab-page__text-2" data-thor="Text">AnimatedCrossFade</span>
        <div class="t-lab-page__column-3" data-thor="Column">
          <button class="t-lab-page__filled-button" type="button" data-t-on="click:LabState.toggleFade" data-thor="FilledButton">Cambiar</button>
          <div class="t-lab-page__animated-cross-fade" data-tv="LabState.isFaded" data-tsz="300|linear|300" data-thor="AnimatedCrossFade" data-tp-1="0.0|class|=t-lab-page__div-4;0.1|class|=t-lab-page__div-3">
            <div class="t-lab-page__div-2">
              <div class="t-lab-page__div-3"><span class="t-lab-page__text-5" data-thor="Text">Primero</span></div>
              <div class="t-lab-page__div-4"><span class="t-lab-page__text-6" data-thor="Text">Segundo, más alto</span></div>
            </div>
          </div>
        </div>
        <span class="t-lab-page__text-2" data-thor="Text">SizeTransition</span>
        <div class="t-lab-page__column-3" data-thor="Column">
          <button class="t-lab-page__filled-button" type="button" data-t-on="click:LabState.togglePanel" data-thor="FilledButton">Abrir o cerrar</button>
          <div class="t1ymef6b t-lab-page__size-transition" data-ta="[{&quot;c&quot;:&quot;LabState.panel&quot;,&quot;k&quot;:[{&quot;offset&quot;:0.0,&quot;gridTemplateRows&quot;:&quot;0fr&quot;,&quot;easing&quot;:&quot;cubic-bezier(0, 0, 0.58, 1)&quot;},{&quot;offset&quot;:1.0,&quot;gridTemplateRows&quot;:&quot;1fr&quot;}]},{&quot;c&quot;:&quot;LabState.panel&quot;,&quot;k&quot;:[{&quot;offset&quot;:0.0,&quot;visibility&quot;:&quot;hidden&quot;,&quot;easing&quot;:&quot;cubic-bezier(0, 0, 0.58, 1)&quot;},{&quot;offset&quot;:1.0,&quot;visibility&quot;:&quot;visible&quot;}]}]" data-thor="SizeTransition">
            <div class="t-lab-page__div-5"><span class="t-lab-page__text-7" data-thor="Text">Panel que se pliega</span></div>
          </div>
        </div>
        <span class="t-lab-page__text-2" data-thor="Text">AnimatedSize: ancho y onEnd</span>
        <div class="t-lab-page__column-4" data-thor="Column">
          <button class="t-lab-page__filled-button" type="button" data-t-on="click:LabState.toggleWide" data-thor="FilledButton">Ensanchar</button>
          <div class="t-lab-page__animated-size-2" data-tsz="300|cubic-bezier(0, 0, 0.58, 1)|300|w" data-t-on="transitionend:LabState.sizeEnded" data-thor="AnimatedSize">
            <div class="t-lab-page__div-6">
              <div class="t-lab-page__container-4" data-tv="LabState.isWide" data-thor="Container" data-tp-1="|class|=t-lab-page__container-5"></div>
            </div>
          </div>
          <span class="t-lab-page__text-4" data-tt="LabState.sizeEndLabel" data-thor="Text">Fin: 0</span>
        </div>
        <span class="t-lab-page__text-2" data-thor="Text">Watch de un campo</span>
        <div class="t-lab-page__row" data-thor="Row">
          <button class="t-lab-page__filled-button" type="button" data-t-on="click:LabState.toggleFlag" data-thor="FilledButton">Alternar el campo</button>
          <span class="t-lab-page__text-8" data-tv="LabState.flag" data-thor="Text" data-tp-1="|#|=Campo: sí">Campo: no</span>
        </div>
        <span class="t-lab-page__text-2" data-thor="Text">Theme.of sigue al tema</span>
        <div class="t-lab-page__row-2" id="theme-surface" data-thor="Row">
          <div class="t-lab-page__container-6" id="theme-primary" data-thor="Container"></div>
          <div class="t-lab-page__container-7" id="theme-soft" data-thor="Container"></div>
        </div>
      </main>
    </div>
  </body>
</html>
